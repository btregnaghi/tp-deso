
spring.application.name=api

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:6432/evaluaciones
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Parametros de las evaluaciones (CU026). Valores elegidos por el grupo.
evaluacion.duracion-en-minutos=60
evaluacion.cant-preguntas-por-bloque=5
